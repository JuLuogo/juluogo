<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">peroe · JuLuogo</title>
  <desc id="desc">A banner for JuLuogo's GitHub profile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101C36"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="name" x1="78" y1="170" x2="440" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="accent" x1="48" y1="0" x2="48" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 20) rotate(130) scale(460 360)">
      <stop stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 320) rotate(-45) scale(420 300)">
      <stop stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="320" rx="28" fill="url(#glowB)"/>

  <rect x="48" y="96" width="4" height="150" rx="2" fill="url(#accent)"/>

  <text x="80" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3.5" fill="#7DD3FC">GITHUB · PROFILE</text>

  <text x="76" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#name)">peroe</text>

  <text x="82" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">@JuLuogo · Self-hosted &amp; Cloudflare</text>

  <text x="82" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#64748B">github.com/juluogo</text>

  <g filter="url(#shadow)">
    <rect x="872" y="84" width="340" height="156" rx="16" fill="#0F172A" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
  <circle cx="896" cy="108" r="5" fill="#F87171"/>
  <circle cx="914" cy="108" r="5" fill="#FBBF24"/>
  <circle cx="932" cy="108" r="5" fill="#34D399"/>
  <text x="896" y="146" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#94A3B8">$ whoami</text>
  <text x="896" y="174" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#E2E8F0">peroe / juluogo</text>
  <text x="896" y="202" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" fill="#7DD3FC">self-hosted &amp; cloudflare</text>

  <circle cx="1216" cy="72" r="3" fill="#38BDF8" fill-opacity="0.9"/>
  <circle cx="1238" cy="252" r="2.5" fill="#A78BFA" fill-opacity="0.9"/>
  <circle cx="812" cy="252" r="2" fill="#7DD3FC" fill-opacity="0.8"/>
</svg>
